<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>猜☆拳☆王</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=43">
</head>
<body>

<div id="lobby" class="screen lobby-screen">
  <div class="lobby-frame" aria-hidden="true">
    <span class="lf-corner lf-tl"></span><span class="lf-corner lf-tr"></span>
    <span class="lf-corner lf-bl"></span><span class="lf-corner lf-br"></span>
  </div>
  <div class="lobby-starmap" aria-hidden="true"></div>

  <div class="lobby-left">
    <div class="lobby-brand">
      <svg class="lobby-compass" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" class="lc-ring lc-ring-dash"/>
        <circle cx="50" cy="50" r="34" class="lc-ring"/>
        <g class="lc-star">
          <path d="M50 6 L57 43 L94 50 L57 57 L50 94 L43 57 L6 50 L43 43 Z"/>
        </g>
        <circle cx="50" cy="50" r="3.2" class="lc-core"/>
      </svg>
      <h1>猜<span class="lb-sep">☆</span>拳<span class="lb-sep">☆</span>王</h1>
      <div class="lobby-divider"><span></span><i class="ld-dot">◈</i><span></span></div>
    </div>

    <div class="lobby-name-row">
      <input id="nameInput" type="text" placeholder="輸入你的名字" maxlength="12">
    </div>

    <div class="lobby-actions">
      <button id="createBtn" class="lobby-btn">
        <span class="lb-label">建立房間</span>
        <span class="lb-icon lb-icon-sun"></span>
      </button>

      <div class="lobby-btn lobby-btn-join">
        <input id="codeInput" type="text" placeholder="房間代碼" maxlength="5">
        <button id="joinBtn" class="lb-join-trigger">
          <span class="lb-label">加入房間</span>
          <span class="lb-icon lb-icon-eye"></span>
        </button>
      </div>

      <div class="lobby-btn lobby-btn-ai">
        <div class="lb-row">
          <span class="lb-label">單人對戰 AI</span>
          <span class="lb-icon lb-icon-veil"></span>
        </div>
        <div class="diff-buttons">
          <button data-diff="easy" class="diffBtn">簡單</button>
          <button data-diff="normal" class="diffBtn">普通</button>
          <button data-diff="hard" class="diffBtn">困難</button>
        </div>
      </div>

      <button id="rulesBtnLobby" class="lobby-btn" onclick="showRules()">
        <span class="lb-label">規則說明</span>
        <span class="lb-icon lb-icon-eye"></span>
      </button>
    </div>

    <div id="lobbyMsg" class="msg"></div>

    <p class="lobby-tagline">星辰銘記,吾等亦然。<br>THE STARS REMEMBER. SO DO WE.</p>
  </div>
</div>

<div id="waiting" class="screen hidden">
  <h2>房間已建立</h2>
  <p>把這個代碼給對方,請他輸入代碼加入:</p>
  <div id="roomCodeDisplay" class="room-code"></div>
  <button id="copyCodeBtn">複製代碼</button>
  <p class="dim">等待對手加入...</p>
</div>

<div id="gameScreen" class="screen hidden">
  <!-- 頂部壓到最薄:回合用「⟳ 數字」,紀錄/規則只留 icon,把畫面高度讓給戰場 -->
  <div id="topBar">
    <span id="statusText" class="round-chip"></span>
    <!-- 雙人對戰限時 60 秒出牌,只在等你決策時出現 -->
    <span id="turnTimer" class="turn-timer hidden"></span>
    <div class="topbar-btns">
      <button id="logToggleBtn" class="icon-btn" title="對戰紀錄" aria-label="對戰紀錄">☰</button>
      <button id="rulesBtn" class="icon-btn" title="規則說明(含操作方式)" aria-label="規則說明">?</button>
    </div>
  </div>
  <div id="board">
    <div id="oppBand" class="band"></div>
    <div id="battlefield" class="band bf"></div>
    <div id="myBand" class="band"></div>
  </div>
</div>

<div id="coinFlipOverlay" class="overlay hidden">
  <div class="coin-flip-box">
    <div class="coin-stage">
      <div id="coinEl" class="coin">
        <div id="coinFrontFace" class="coin-face coin-front"></div>
        <div id="coinBackFace" class="coin-face coin-back"></div>
      </div>
    </div>
    <div id="coinResultText" class="coin-result"></div>
  </div>
</div>

<!-- 抽牌二選一:牌庫縮圖在角落太小很難點,改成蓋滿畫面的兩張大牌,可直接往下滑抽牌 -->
<div id="drawPickOverlay" class="overlay hidden">
  <div class="draw-pick-box">
    <div id="drawPickTitle" class="draw-pick-title"></div>
    <div id="drawPickCards" class="draw-pick-cards"></div>
    <div class="draw-pick-hint">往下滑動卡牌抽牌,或直接點選</div>
  </div>
</div>

<div id="modalOverlay" class="overlay hidden">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalPrompt"></p>
    <div id="modalButtons" class="modal-buttons"></div>
  </div>
</div>

<div id="rulesOverlay" class="overlay hidden">
  <div class="modal-box rules-box">
    <pre id="rulesText"></pre>
    <button id="rulesCloseBtn">關閉</button>
  </div>
</div>

<div id="logOverlay" class="overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal-box log-box">
    <h3>對戰紀錄</h3>
    <pre id="logText"></pre>
    <button id="logCloseBtn">關閉</button>
  </div>
</div>

<div id="eclipseCutinOverlay" class="overlay hidden eclipse-cutin-overlay">
  <img id="eclipseCutinImg" class="eclipse-cutin-img" alt="">
</div>

<div id="gameOverOverlay" class="overlay hidden go-overlay">
  <div id="goBg" class="go-bg"></div>
  <div class="go-scrim"></div>
  <div id="goParticles" class="go-particles"></div>
  <div class="go-content">
    <img id="goMedallion" class="go-medallion" alt="">
    <div id="goResultText" class="go-result-text"></div>
    <div id="goWinnerName" class="go-winner-name"></div>
    <div class="go-actions">
      <button id="goRematchBtn" class="go-btn go-btn-primary">再戰一次</button>
      <button id="goLobbyBtn" class="go-btn">返回大廳</button>
    </div>
  </div>
</div>

<div id="discardOverlay" class="overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal-box discard-box">
    <h3 id="discardOverlayTitle"></h3>
    <div id="discardOverlayGrid" class="discard-grid"></div>
    <p class="dim discard-hint">長按卡片可以看效果說明</p>
    <button id="discardCloseBtn">關閉</button>
  </div>
</div>

<div id="cardInfoOverlay" class="overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal-box card-info-box">
    <img id="cardInfoImg" class="card-info-img" alt="">
    <div class="card-info-header">
      <span id="cardInfoName" class="card-info-name"></span>
      <span id="cardInfoKind" class="card-info-kind"></span>
    </div>
    <pre id="cardInfoText" class="card-info-text"></pre>
    <button onclick="$('cardInfoOverlay').classList.add('hidden')">關閉</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- ?v= 是手動版本號,每次改動 rules.js/engine.js/net.js/app.js/style.css 就要遞增,
     避免玩家瀏覽器快取到部署前的舊版程式碼、看不到最新的修正 -->
<script src="rules.js?v=43"></script>
<script src="engine.js?v=43"></script>
<script src="net.js?v=43"></script>
<script src="app.js?v=43"></script>
</body>
</html>
